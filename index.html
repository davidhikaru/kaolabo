<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- 確保在手機上瀏覽時比例正確 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カオラボ (KaoLabo) - AI顔診断</title>
  
  <!-- 載入 CSS 樣式 (我們下一步會寫) -->
  <link rel="stylesheet" href="css/style.css">
  
  <!-- 載入 Supabase JS SDK (讓前端能跟資料庫溝通) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="app-container">
    <!-- 標題區塊 -->
    <header>
      <h1>✨ カオラボ ✨</h1>
      <p class="subtitle">AIがあなたのビジュアルスコアを測定します！</p>
    </header>

    <!-- 步驟 1: 同意規約的彈跳視窗 (預設顯示) -->
    <div id="consent-modal" class="modal">
      <div class="modal-content">
        <h2>利用規約とプライバシー</h2>
        <div class="terms-body">
          <p>本アプリでは、顔のバランス分析のため、カメラ機能を使用します。</p>
          <p>※分析精度向上およびサービス運営のため、撮影された画像はサーバーに安全に送信・保存されます。同意いただける場合のみご利用ください。</p>
        </div>
        <button id="btn-agree" class="btn-primary">同意して始める</button>
      </div>
    </div>

    <!-- 步驟 2: 主畫面 (相機與操作區) -->
    <main class="main-content">
      <div class="camera-wrapper">
        <!-- 隱藏的 video 標籤，用來接收相機畫面 -->
        <video id="webcam" autoplay playsinline muted hidden></video>
        <!-- 實際顯示給使用者看並用來截圖的畫布 -->
        <canvas id="preview-canvas" width="320" height="320"></canvas>
        <!-- 掃描特效線 (一開始隱藏) -->
        <div id="scan-line" class="scan-line hidden"></div>
      </div>

      <div class="controls">
        <button id="btn-start-camera" class="btn-secondary">カメラを起動</button>
        <!-- 預設為不可點擊 (disabled)，等相機啟動後才開啟 -->
        <button id="btn-scan" class="btn-accent" disabled>診断スタート！</button>
      </div>

      <!-- 步驟 3: 診斷結果區塊 (一開始隱藏) -->
      <div id="result-area" class="result-card hidden">
        <h2>🎉 診断結果 🎉</h2>
        <div class="score-box">
          <span class="score-label">スコア:</span>
          <span id="score-number" class="score-val">0</span> <span class="unit">点</span>
        </div>
        <p id="result-comment" class="comment">結果を分析中です...</p>
        <button id="btn-retry" class="btn-secondary">もう一度診断する</button>
      </div>
    </main>
  </div>

  <!-- 載入主控 JavaScript (必須加上 type="module" 才能使用外掛拆開的寫法) -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
