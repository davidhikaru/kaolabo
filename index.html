<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カオラボ (KaoLabo) - AI顔診断</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="app-container">

    <!-- 規約彈窗 -->
    <div id="consent-modal" class="modal-overlay">
      <div class="game-card modal-card">
        <h2 class="card-title">利用規約とプライバシー</h2>
        <p class="card-desc">
          本アプリでは、顔のバランス分析のため、カメラ機能を使用します。<br>
          ※分析精度向上およびサービス運営のため、撮影された画像はサーバーに安全に送信・保存されます。同意いただける場合のみご利用ください。
        </p>
        <button id="btn-agree" class="btn btn-pink btn-block">同意して始める</button>
      </div>
    </div>

    <!-- 主遊戲卡片 -->
    <main class="game-card">
      <h1 class="card-title">✨ カオラボ ✨</h1>
      <p class="card-subtitle">AIがあなたのビジュアルスコアを測定します！</p>

      <!-- 📸 診斷與相機區塊 -->
      <div id="camera-section">
        <div class="camera-wrapper">
          <video id="webcam" autoplay playsinline muted hidden></video>
          <canvas id="preview-canvas" width="320" height="320"></canvas>
          
          <!-- 新增：多角度掃描引導與進度條 -->
          <div id="scan-overlay" class="scan-overlay hidden">
            <div class="scan-text-box">
              <p id="scan-instruction">正面の顔をスキャン中...</p>
            </div>
            <div class="progress-container">
              <div id="scan-progress" class="progress-fill" style="width: 0%;"></div>
            </div>
          </div>
        </div>

        <div class="controls">
          <button id="btn-start-camera" class="btn btn-secondary">カメラを起動</button>
          <button id="btn-scan" class="btn btn-pink btn-block" disabled>診断スタート！</button>
        </div>
      </div>

      <!-- 🏆 新增：獨立結算區塊 (初始隱藏) -->
      <div id="result-section" class="result-card hidden">
        <div class="stamp-badge" id="result-stamp">🎉 診断結果 🎉</div>
        <div class="score-display">
          <span class="label">スコア：</span>
          <span id="score-number" class="score-val">0</span>
          <span class="unit">点</span>
        </div>
        <p id="result-comment" class="comment">分析中...</p>
        
        <div class="result-controls">
          <button id="btn-share" class="btn btn-blue btn-block">結果をシェアする</button>
          <button id="btn-retry" class="btn btn-secondary btn-block">もう一度診断する</button>
        </div>
      </div>

    </main>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
