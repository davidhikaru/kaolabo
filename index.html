<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カオラボ (KaoLabo) - AI顔診断</title>
  
  <!-- 載入日系可愛圓體 Zen Maru Gothic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="app-container">

    <!-- 規約彈窗 (完全還原圖一卡片風格) -->
    <div id="consent-modal" class="modal-overlay">
      <div class="game-card modal-card">
        <h2 class="card-title">AI黄金比顔タイプ診断</h2>
        <p class="card-desc">
          カメラで顔のバランスを分析し、あなたのビジュアルスコアを測定するゲームです。かなり高度（？）なAI診断。
        </p>

        <ul class="rule-list">
          <li>
            <span class="badge">1</span>
            <div class="rule-text">「カメラ起動」を押して、お顔をカメラの正面に向けてください。</div>
          </li>
          <li>
            <span class="badge">2</span>
            <div class="rule-text">「診断スタート！」を押すと、AIが黄金比をスキャンします。</div>
          </li>
          <li>
            <span class="badge">3</span>
            <div class="rule-text">分析精度向上のため撮影画像はサーバーに保存されます。同意の上お楽しみください。</div>
          </li>
        </ul>

        <button id="btn-agree" class="btn btn-green btn-block">スタート</button>
      </div>
    </div>

    <!-- 主遊戲卡片 -->
    <main class="game-card">
      <h1 class="card-title">✨ カオラボ ✨</h1>
      <p class="card-subtitle">AIビジュアル測定</p>

      <div class="camera-wrapper">
        <video id="webcam" autoplay playsinline muted hidden></video>
        <canvas id="preview-canvas" width="320" height="320"></canvas>
        <div id="scan-line" class="scan-line hidden"></div>
      </div>

      <div class="controls">
        <button id="btn-start-camera" class="btn btn-secondary">カメラを起動</button>
        <button id="btn-scan" class="btn btn-green btn-block" disabled>診断スタート！</button>
      </div>

      <!-- 結果顯示卡片 (圖二風手繪貼紙感) -->
      <div id="result-area" class="result-card hidden">
        <div class="stamp-badge">すごすぎる！！</div>
        <div class="score-display">
          <span class="label">スコア</span>
          <span id="score-number" class="score-val">0</span>
          <span class="unit">点</span>
        </div>
        <p id="result-comment" class="comment">分析中...</p>
        <button id="btn-retry" class="btn btn-secondary">もう一度診断する</button>
      </div>
    </main>

  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
